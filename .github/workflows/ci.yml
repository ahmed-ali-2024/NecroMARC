name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # No secrets are used. Tests must not reach OpenRouter, Gemini or Supabase.
  HYPOTHESIS_PROFILE: ci
  HYPOTHESIS_SEED: "20240601"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Assert .kiro/ is not ignored
        run: |
          if git check-ignore -q .kiro/specs/necromarc/tasks.md .kiro/steering; then
            echo ".kiro/ must not be git-ignored" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Dependency check
        run: python scripts/check_deps.py

      - name: Secret scan
        run: python scripts/secret_scan.py

      - name: Pytest
        run: pytest --hypothesis-seed=20240601

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: i18n check
        run: npm run check:i18n

      - name: Build
        run: npm run build
        env:
          PUBLIC_BASE_PATH: /necromarc
          PUBLIC_API_URL: https://3aai.in/necromarc/api

      - name: Bundle check
        run: npm run check:bundle
