name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the FTP changes without applying them"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # No secrets are used. Tests must not reach OpenRouter, Gemini or Supabase.
  HYPOTHESIS_PROFILE: ci
  HYPOTHESIS_SEED: "20240601"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Assert .kiro/ is not ignored
        run: |
          if git check-ignore -q .kiro/specs/necromarc/tasks.md .kiro/steering; then
            echo ".kiro/ must not be git-ignored" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Dependency check
        run: python scripts/check_deps.py

      - name: Secret scan
        run: python scripts/secret_scan.py

      - name: Pytest
        run: pytest --hypothesis-seed=20240601

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: i18n check
        run: npm run check:i18n

      - name: Build
        run: npm run build
        env:
          PUBLIC_BASE_PATH: /necromarc
          PUBLIC_API_URL: https://3aai.in/necromarc/api

      - name: Bundle check
        run: npm run check:bundle

      # The deploy job publishes exactly the build that was tested.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    # Only after both test jobs pass, only for main, never for pull requests.
    needs: [python, frontend]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: frontend-dist
          path: dist/

      - name: Check FTP secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name" >&2
              exit 1
            fi
          done

      # FTP account is restricted to public_html/necromarc, so the server dir is "./".
      # Excluded paths are neither uploaded nor deleted:
      #   - api/ is the Passenger application mount managed from cPanel
      #   - .htaccess on the server carries the /necromarc/api rewrite exception
      # dangerous-clean-slate must stay false.
      - name: Sync frontend over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          log-level: standard
          exclude: |
            **/.htaccess
            api
            api/**
            **/.ftp-deploy-sync-state.json
